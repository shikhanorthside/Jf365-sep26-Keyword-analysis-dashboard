*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:#0D1B2A;color:#fff}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;background:#13263A;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:36px 32px;box-shadow:0 20px 60px rgba(0,0,0,.4)}

.row{position:relative}
input{width:100%;padding:12px 44px 12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:#0D1B2A;color:#fff;font-size:15px;font-family:inherit;outline:none}
input:focus{border-color:#00C7B1;box-shadow:0 0 0 3px rgba(0,199,177,.18)}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:rgba(255,255,255,.5);cursor:pointer;font-size:12px;padding:6px}
button.go{width:100%;margin-top:14px;padding:12px;border:0;border-radius:8px;background:#00C7B1;color:#0D1B2A;font-weight:700;font-size:14px;font-family:'Poppins',sans-serif;cursor:pointer;letter-spacing:.3px}
button.go:disabled{opacity:.6;cursor:wait}
.msg{min-height:18px;margin-top:12px;font-size:12px;text-align:center;color:#FF8A8A}
.foot{margin-top:22px;font-size:10px;color:rgba(255,255,255,.3);text-align:center;letter-spacing:.6px;text-transform:uppercase}

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=id=>document.getElementById(id);
$('eye').onclick=()=>{const p=$('pw');p.type=p.type==='password'?'text':'password';$('eye').textContent=p.type==='password'?'Show':'Hide';};
async function unlock(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},key,u8(CT));
  return new TextDecoder().decode(pt);
}
$('f').onsubmit=async e=>{
  e.preventDefault(); const pw=$('pw').value; if(!pw) return;
  $('go').disabled=true; $('msg').style.color='rgba(255,255,255,.6)'; $('msg').textContent='Checking…';
  try{
    if(!window.isSecureContext||!crypto.subtle) throw new Error('nocrypto');
    const html=await unlock(pw);
    document.open(); document.write(html); document.close();
  }catch(err){
    $('go').disabled=false; $('msg').style.color='#FF8A8A';
    $('msg').textContent= err&&err.message==='nocrypto' ? 'This page must be opened over https (or from your computer in Chrome).' : 'Incorrect password. Please try again.';
    $('pw').select();
  }
};
